[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avios-cli"
description = "A CLI and TUI for Avios balances, transactions, and BA reward-flight availability."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alex Choi" }]
keywords = ["avios", "british-airways", "cli", "tui", "loyalty", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "textual>=0.80",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Browser-assisted login and BA reward search. Kept optional so account-only
# commands remain lightweight when a user does not need a browser.
login = [
    "playwright>=1.44",
    "browser-cookie3>=0.19",
]

# Dev tooling lives in a PEP 735 dependency-group (not an extra) so that `uv sync`
# and `uv run` install it by default — an extra would be pruned by `uv run`.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
avios = "avios.cli:app"
# Alias so `uvx avios-cli` (matching the package name) works too.
avios-cli = "avios.cli:app"

[project.urls]
Homepage = "https://github.com/alexechoi/avios-cli"
Repository = "https://github.com/alexechoi/avios-cli"
Issues = "https://github.com/alexechoi/avios-cli/issues"

[tool.hatch.version]
path = "src/avios/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/avios"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer's API intentionally uses these calls as parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["browser_cookie3.*", "playwright.*"]
ignore_missing_imports = true
